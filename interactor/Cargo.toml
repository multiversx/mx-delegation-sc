[[bin]]
name = "basic-interact"
path = "src/deleg_interactor.rs"

[package]
name = "delegation-interact"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
hex = "0.4.3"
tokio = { version = "1.24" }
env_logger = "0.11"
rand = "0.10"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.multiversx-sc]
version = "=0.66.2"

[dependencies.multiversx-sc-snippets]
version = "=0.66.2"

[dependencies.node-storage]
path = "../node-storage"

[dependencies.user-fund-storage]
path = "../user-fund-storage"
