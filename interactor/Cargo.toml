[[bin]]
name = "basic-interact"
path = "src/deleg_interactor.rs"

[package]
name = "delegation-interact"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
hex = "0.4.3"
tokio = { version = "1.24" }
env_logger = "0.11"
rand = "0.10"

[dependencies.clap]
version = "4.4.7"
features = ["derive"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.multiversx-sc]
version = "=0.66.2"

[dependencies.multiversx-sc-snippets]
version = "=0.66.2"

[dependencies.node-storage]
path = "../node-storage"

[dependencies.user-fund-storage]
path = "../user-fund-storage"
