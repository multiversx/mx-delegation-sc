# Chain and the address of the contract on that chain. Keep exactly one block uncommented.
[chain_config]
# chain_type = 'real'
# gateway_uri = 'https://gateway.multiversx.com'
# sc_address = "erd1qqqqqqqqqqqqqpgqxwakt2g7u9atsnr03gqcgmhcv38pt7mkd94q6shuwt"

# chain_type = 'real'
# gateway_uri = 'https://devnet-gateway.multiversx.com'
# sc_address = "erd1qqqqqqqqqqqqqpgq97wezxw6l7lgg7k9rxvycrz66vn92ksh2tssxwf7ep"

# chain_type = 'real'
# gateway_uri = 'https://testnet-gateway.multiversx.com'
# sc_address = "erd1qqqqqqqqqqqqqpgq97wezxw6l7lgg7k9rxvycrz66vn92ksh2tssxwf7ep"

chain_type = 'simulator'
gateway_uri = 'http://localhost:8085'
sc_address = "erd1qqqqqqqqqqqqqpgqyuat4jjzzmn5hmrtfwl32azlhxwhyjwdd94qwrzv80"

# Contract owner - upgrades and admin endpoints.
[owner]
# pem = 'legacyDelegationOwner.pem'
test_wallet = 'alice'

# Main user - stake, unstake, vote.
[user]
pem = 'delegator1.pem'

# Secondary user. Currently unused: claiming is a test.toml action, which uses [user].
# [user2]
# pem = 'delegator2.pem'

# Sends the continueGlobalOperation transactions.
[continue_global_sender]
# pem = 'legacyDelegationOwner.pem'
no_sig = 'erd1nszf4y8dkply45skqxa2998uypc53tdsd26ycl5yndtqhl7j2tssfxzk2y'

# Deployment of a new contract, relevant when testing on chain-simulator.
[deploy]
# Full contract code.
contract_path = '../latest/output/delegation_latest_full.wasm'
# Constructor arguments.
auction_address = "erd1qqqqqqqqqqqqqqqpqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqplllst77y4l"
service_fee_per_10000 = 1000
owner_min_stake_share_per_10000 = 500
n_blocks_before_unbond = 10
# Atomic units (1 EGLD = 10^18), as strings.
minimum_stake = "1000000000000000000"
total_delegation_cap = "100000000000000000000000"

# Upgrade of the existing contract, relevant when testing on chain-simulator,
# or a shadow-fork.
[upgrade]
# New implementation:
# contract_path = '../latest/output/delegation_latest_update.wasm'
# Backwards compatible implementation:
contract_path = '../v0_5_10_update/output/delegation_v0_5_10_update.wasm'
